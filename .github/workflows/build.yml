name: Build Android ARM64 tools

on:
  workflow_dispatch:
    inputs:
      tools:
        description: Tools to build
        type: choice
        default: curl jq
        options:
          - curl
          - curl jq
  push:
    paths:
      - .github/workflows/build.yml
      - scripts/**
      - sources.json
      - docs/**

permissions:
  contents: read

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SELECTED_TOOLS: ${{ inputs.tools || 'curl jq' }}
      ANDROID_NDK_HOME: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build and verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config perl python3 unzip qemu-user openssl
      - name: Download and verify upstream sources and Android NDK
        run: |
          sources=(ndk curl openssl nghttp2 zlib cacert)
          read -r -a tools <<< "$SELECTED_TOOLS"
          for tool in "${tools[@]}"; do
            if [[ "$tool" == jq ]]; then sources+=(jq); fi
          done
          python3 scripts/prepare-sources.py "${sources[@]}"
      - name: Cross-compile for Android 10+ ARM64
        run: |
          read -r -a tools <<< "$SELECTED_TOOLS"
          bash scripts/build.sh "${tools[@]}"
      - name: Test ARM64 binaries with QEMU
        run: python3 scripts/smoke-test.py
      - name: Generate package checksum and build summary
        run: |
          sha256sum dist/android-arm64-tools.tar.gz > dist/android-arm64-tools.tar.gz.sha256
          {
            printf '### Android ARM64 tools\n\n'
            printf -- '- Target: Android 10+ (API 29), ARM64\n'
            printf -- '- Tools: %s\n' "$SELECTED_TOOLS"
            printf -- '- Built from verified upstream source archives on this GitHub runner\n'
            printf -- '- ARM64 executable and TLS tests passed\n\n'
            printf 'Download the package and checksum from this run’s Artifacts.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload executable package
        uses: actions/upload-artifact@v7
        with:
          name: android-arm64-tools
          path: |
            dist/android-arm64-tools.tar.gz
            dist/android-arm64-tools.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
