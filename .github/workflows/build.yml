name: Build Android tools

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'all, or tool names from BUILD-LIST.md (space-separated)'
        type: string
        default: all
      architectures:
        description: 'all, or space-separated: arm64 armv7 x86_64 x86'
        type: string
        default: all
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - scripts/**
      - patches/**
      - sources.json
      - build-list.json
      - BUILD-LIST.md
      - docs/**

permissions:
  contents: read

concurrency:
  group: android-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check catalog and release validation
        run: |
          python3 scripts/catalog.py check
          python3 -m unittest discover -s tests -v
      - id: matrix
        name: Select tools and architectures
        env:
          SELECTED_TOOLS: ${{ inputs.tools || 'all' }}
          SELECTED_ARCHITECTURES: ${{ inputs.architectures || 'all' }}
        run: python3 scripts/catalog.py plan --tools "$SELECTED_TOOLS" --architectures "$SELECTED_ARCHITECTURES"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ARCH: ${{ matrix.arch }}
      BUILD_TOOLS: ${{ matrix.tools }}
      ANDROID_NDK_HOME: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build and verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config perl python3 unzip qemu-user openssl flex bison autoconf automake libtool
      - name: Download and verify upstream sources and Android NDK
        run: |
          read -r -a sources <<< "$(python3 scripts/catalog.py dependencies --tools "$BUILD_TOOLS")"
          python3 scripts/prepare-sources.py "${sources[@]}"
          python3 -c 'import json,os; ndk=json.load(open("sources.json"))["ndk"]["directory"]; open(os.environ["GITHUB_ENV"],"a").write("ANDROID_NDK_HOME="+os.getcwd()+"/.work/"+ndk+"\n")'
      - name: Cross-compile selected Android tools
        run: |
          read -r -a tools <<< "$BUILD_TOOLS"
          failed=()
          for tool in "${tools[@]}"; do
            echo "::group::Compile ${tool} (${ARCH})"
            if ! BUILD_MODE=compile bash scripts/build.sh "$tool"; then
              failed+=("$tool")
            fi
            echo '::endgroup::'
          done
          if ((${#failed[@]})); then
            echo "Failed tools: ${failed[*]}" >&2
            exit 1
          fi
          BUILD_MODE=package bash scripts/build.sh "${tools[@]}"
      - name: Test actual executables
        # 32-bit Bionic mutexes require TIDs <= 65535. A fresh PID namespace
        # keeps QEMU's guest IDs small after the compiler spawned many tasks.
        # Drop back to the runner user so tests retain normal user permissions.
        run: sudo unshare --pid --fork --mount-proc runuser -u "$(id -un)" -- env ARCH="$ARCH" python3 scripts/smoke-test.py
      - name: Generate package checksum and summary
        run: |
          sha256sum "dist/android-${ARCH}-tools.tar.gz" > "dist/android-${ARCH}-tools.tar.gz.sha256"
          printf '### %s\n\nTools: %s\n\nBuild, ELF and executable smoke checks passed.\n' "$ARCH" "$BUILD_TOOLS" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload architecture package
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.arch }}-tools
          path: |
            dist/android-${{ matrix.arch }}-tools.tar.gz
            dist/android-${{ matrix.arch }}-tools.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
