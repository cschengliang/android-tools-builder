name: Publish Android ARM64 release

on:
  workflow_run:
    workflows: [Build Android ARM64 tools]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build.yml run ID to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: android-release-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Test release validation
        run: python3 -m unittest discover -s tests -v
      - name: Publish verified build artifacts
        run: python3 release/publish.py --run-id "$SOURCE_RUN_ID"
